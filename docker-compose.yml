services:
  neo4j:
    image: neo4j:5
    container_name: gym-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gym-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./data/chroma:/app/data/chroma
      - fastembed_cache:/root/.cache/fastembed
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - neo4j

  n8n:
    image: n8nio/n8n
    container_name: gym-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Europe/Minsk
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - ./data/n8n:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fastembed_cache:
  whisper_cache:
