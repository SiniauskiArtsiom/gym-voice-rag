[project]
name = "gym-voice-rag"
version = "0.1.0"
description = "Gym Voice RAG Assistant: RAG + Neo4j + STT/TTS + n8n"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "openai>=1.50",
    "neo4j>=5.25",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
    "pytest>=8.3",
    "ruff>=0.7",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["black", "isort"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
